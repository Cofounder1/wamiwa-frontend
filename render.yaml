services:
  - type: web
    name: wamiwa-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Set in the Render dashboard to the deployed backend, e.g. https://wamiwa-api.onrender.com
      - key: VITE_API_URL
        sync: false
    routes:
      # The app handles its own routes, so every path serves index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Vite fingerprints these files, so they can be cached for good
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
